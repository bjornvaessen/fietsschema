<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fietsschema Sept–Dec 2026</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #F4F7F4; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    #root { max-width: 480px; margin: 0 auto; min-height: 100vh; padding-bottom: 48px; }

    button { font-family: inherit; cursor: pointer; }

    .header {
      background: linear-gradient(135deg, #1B4332 0%, #2D6A4F 100%);
      padding: 28px 20px 22px;
      color: #fff;
    }
    .header-eyebrow {
      font-size: 11px; font-weight: 700; letter-spacing: 2.5px;
      opacity: 0.6; text-transform: uppercase; margin-bottom: 6px;
    }
    .header-title { font-size: 22px; font-weight: 800; margin-bottom: 2px; }
    .header-sub { font-size: 13px; opacity: 0.75; }

    .toggle-wrap {
      margin-top: 18px;
      background: rgba(255,255,255,0.13);
      border-radius: 40px;
      padding: 4px;
      display: flex;
      gap: 2px;
    }
    .toggle-btn {
      flex: 1; padding: 10px 8px; border: none; border-radius: 36px;
      font-size: 14px; transition: background 0.2s, color 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .toggle-btn.active { background: #fff; color: #1B4332; font-weight: 700; }
    .toggle-btn.inactive { background: transparent; color: rgba(255,255,255,0.85); font-weight: 500; }

    .indoor-notice {
      margin-top: 10px; font-size: 12px;
      background: rgba(255,255,255,0.12);
      border-radius: 8px; padding: 7px 12px;
      color: rgba(255,255,255,0.9);
    }

    .month-tabs {
      display: flex; background: #fff;
      border-bottom: 1px solid #E0E8E0;
      position: sticky; top: 0; z-index: 10;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .tab-btn {
      flex: 1; padding: 13px 2px; border: none; background: transparent;
      font-size: 12px; transition: color 0.15s, border-color 0.15s;
    }
    .tab-btn.active { font-weight: 800; color: #1B4332; border-bottom: 2px solid #1B4332; }
    .tab-btn.inactive { font-weight: 500; color: #888; border-bottom: 2px solid transparent; }

    .phase-wrap { padding: 14px 16px 0; }
    .phase-title { font-weight: 800; font-size: 14px; color: #1B4332; margin-bottom: 6px; }
    .phase-tip {
      background: #E8F5EE; border-left: 3px solid #2D6A4F;
      border-radius: 0 8px 8px 0; padding: 9px 13px;
      font-size: 13px; color: #1B4332; line-height: 1.55;
    }

    .weeks-list { padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px; }

    .week-card {
      border-radius: 14px; overflow: hidden;
      background: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .week-card.open {
      border: 1.5px solid #2D6A4F;
      box-shadow: 0 3px 14px rgba(45,106,79,0.12);
    }
    .week-card.closed {
      border: 1.5px solid #E0E8E0;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
    }

    .week-header {
      display: flex; align-items: center; padding: 14px 16px; cursor: pointer;
      transition: background 0.15s;
    }
    .week-header.open { background: #F0FAF4; }
    .week-header.closed { background: #fff; }

    .week-badge {
      min-width: 44px; height: 44px; border-radius: 12px;
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; margin-right: 12px; transition: background 0.2s;
    }
    .week-badge.open { background: #2D6A4F; }
    .week-badge.closed { background: #F0F0F0; }
    .week-badge-label {
      font-size: 9px; font-weight: 800; line-height: 1; text-transform: uppercase;
    }
    .week-badge.open .week-badge-label { color: rgba(255,255,255,0.65); }
    .week-badge.closed .week-badge-label { color: #999; }
    .week-badge-num { font-size: 17px; font-weight: 900; line-height: 1; }
    .week-badge.open .week-badge-num { color: #fff; }
    .week-badge.closed .week-badge-num { color: #555; }

    .week-info { flex: 1; }
    .week-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .week-title { font-weight: 800; font-size: 14px; color: #1B4332; }
    .week-badge-current {
      font-size: 10px; font-weight: 700; background: #2D6A4F; color: #fff;
      border-radius: 20px; padding: 2px 8px;
    }
    .week-badge-note { font-size: 10px; color: #E8774A; font-weight: 600; }
    .week-dates { font-size: 12px; color: #888; margin-top: 2px; }

    .week-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; margin-left: 8px; }
    .week-chevron { font-size: 11px; color: #888; }
    .week-mins { font-size: 10px; color: #aaa; }

    .sessions-wrap {
      padding: 10px 12px 12px;
      border-top: 1px solid #E8F0E8;
      display: flex; flex-direction: column; gap: 8px;
    }

    .sess-card {
      border-radius: 11px; overflow: hidden; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .sess-header {
      display: flex; align-items: center; padding: 12px 14px; gap: 10px;
    }
    .sess-num {
      min-width: 32px; height: 32px; border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 800; transition: background 0.15s, color 0.15s;
    }
    .sess-info { flex: 1; }
    .sess-title { font-weight: 700; font-size: 13px; color: #1A3A2A; margin-bottom: 3px; }
    .sess-right { text-align: right; flex-shrink: 0; }
    .sess-dur { font-weight: 800; font-size: 14px; }
    .sess-chev { font-size: 10px; color: #bbb; }

    .sess-detail {
      padding: 10px 14px 14px;
      display: flex; flex-direction: column; gap: 8px;
    }
    .detail-label {
      font-size: 10px; font-weight: 700; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 4px;
    }
    .detail-text { font-size: 13px; color: #333; line-height: 1.6; }
    .focus-box {
      background: #F0FFF8; border-left: 3px solid #52B788;
      border-radius: 0 8px 8px 0; padding: 8px 12px;
      font-size: 12px; color: #1B4332; line-height: 1.5;
    }
    .pills-row { display: flex; gap: 6px; }
    .pill {
      border-radius: 8px; padding: 4px 9px;
      font-size: 11px; font-weight: 700;
    }

    .pips { display: flex; gap: 4px; }
    .pip { width: 7px; height: 7px; border-radius: 50%; }

    .footer {
      text-align: center; color: #bbb; font-size: 11px;
      margin-top: 20px; padding: 0 20px; line-height: 1.6;
    }
  </style>
</head>

          mk("Vrijheidsrit", "65 min", 2, "Zone 2", "Vrij rijden. Geniet van de winter.", "Mooie rustige momenten in december."),
        ],
        indoor: [
          mk("Intervaltraining", "25 min", 4, "Zone 3–4", "5 min inrijden → 6× (1 min hard, 1,5 min rustig) → 5 min uitrijden.", "Scherp blijven."),
          mk("Herstelrit", "30 min", 2, "Zone 2", "30 min rustig.", "Rust en consistentie."),
          mk("Sweet spot", "35 min", 3, "Zone 3", "5 min inrijden → 2× (10 min sweet spot, 3 min rust) → 7 min uitrijden.", "Solide sessie."),
        ],
      },
      { label: "Week 3", dates: "ma 21 – zo 27 dec", note: "Kerst 🎄",
        outdoor: [
          mk("Winterrit", "40 min", 2, "Zone 2", "Rustig en genieten. Kortste dag was 21 december.", "Goed gekleed — het kan vriezen. Pas op voor ijs."),
          mk("Kerstrit", "50 min", 2, "Zone 2", "Rustig. Geen structuur — gewoon fietsen tussen de kerstdagen door.", "Kerst of niet — doorgaan."),
          mk("Pre-nieuwjaarsrit", "60 min", 2, "Zone 2", "Geniet van de laatste weekrit voor oud & nieuw.", "Terugkijkend: wat een kwartaal."),
        ],
        indoor: [
          mk("Kerst-intervals", "25 min", 4, "Zone 3–4", "5 min inrijden → 6× (1 min hard, 1,5 min rustig) → 5 min uitrijden.", "Feestdagen of niet — doorgaan."),
          mk("Herstelrit", "25 min", 2, "Zone 2", "25 min rustig. Iets korter vanwege de feestdagen.", "Flexibel zijn in december is ook consistentie."),
          mk("Sweet spot", "30 min", 3, "Zone 3", "5 min inrijden → 2× (8 min sweet spot, 3 min rust) → 6 min uitrijden.", "Krachtig afsluiten voor oud & nieuw."),
        ],
      },
      { label: "Week 4", dates: "ma 28 dec – zo 3 jan", note: "Oud & nieuw 🎉",
        outdoor: [
          mk("Eindejaaarsrit", "40 min", 2, "Zone 2", "Rustig tempo. Pas op voor ijs en vuurwerkresten. Geniet van de overgang.", "Consistent in de feestdagen is de echte overwinning."),
          mk("Nieuwjaarsrit", "50 min", 2, "Zone 2", "Eerste of laatste rit van het jaar. Rustig en symbolisch.", "September tot januari: dat is een transformatie."),
          mk("Vrijheidsrit", "60 min", 2, "Zone 2", "Geen plan — gewoon rijden. Kijk terug op hoe ver je gekomen bent.", "Dit is waarom je fietst. Goed gedaan."),
        ],
        indoor: [
          mk("Eindejaar-intervals", "25 min", 4, "Zone 3–4", "5 min inrijden → 6× (1 min hard, 1,5 min rustig) → 5 min uitrijden.", "Sterk 2026 afsluiten."),
          mk("Herstelrit", "25 min", 2, "Zone 2", "25 min rustig. Muziek of serie aan.", "Rustig het nieuwe jaar in."),
          mk("Sweet spot eindejaar", "30 min", 3, "Zone 3", "5 min inrijden → 2× (8 min sweet spot, 3 min rust) → 6 min uitrijden.", "Goed einde van 2026. Wat een jaar!"),
        ],
      },
    ],
  },
};

const ZONE_COLORS = {
  2: { bg: "#EBF4FF", border: "#2C7BB6", pill: "#2C7BB6" },
  3: { bg: "#FFF3ED", border: "#E8774A", pill: "#E8774A" },
  4: { bg: "#FFF0F0", border: "#D94A4A", pill: "#D94A4A" },
};

// ── State ──────────────────────────────────────────────────────
let state = {
  indoor: false,
  month: "September",
  openWeek: 0,
  openSess: null,
};

function setState(patch) {
  state = { ...state, ...patch };
  render();
}

// ── Helpers ────────────────────────────────────────────────────
function totalMins(sessions) {
  return sessions.reduce((acc, s) => {
    const m = s.duration.match(/(\d+)/);
    return acc + (m ? parseInt(m[1]) : 0);
  }, 0);
}

function pips(level) {
  const color = level === 4 ? "#D94A4A" : level === 3 ? "#E8774A" : "#2C7BB6";
  return Array.from({ length: 4 }, (_, i) =>
    `<div class="pip" style="background:${i < level ? color : "#DDD"}"></div>`
  ).join("");
}

// ── Render ─────────────────────────────────────────────────────
function render() {
  const { indoor, month, openWeek, openSess } = state;
  const md = PLAN[month];

  const weeksHtml = md.weeks.map((week, wi) => {
    const sessions = indoor ? week.indoor : week.outdoor;
    const isWeekOpen = openWeek === wi;
    const c = isWeekOpen ? "#2D6A4F" : "#E0E8E0";
    const shadow = isWeekOpen ? "0 3px 14px rgba(45,106,79,0.12)" : "0 1px 4px rgba(0,0,0,0.05)";

    const sessionsHtml = sessions.map((s, si) => {
      const key = `w${wi}s${si}`;
      const isOpen = openSess === key;
      const z = ZONE_COLORS[s.intensity];
      return `
        <div class="sess-card"
          style="background:${isOpen ? z.bg : "#FAFCFA"};border:1.5px solid ${isOpen ? z.border : "#E8EDE8"};"
          onclick="toggleSess('${key}')">
          <div class="sess-header">
            <div class="sess-num" style="background:${isOpen ? z.pill : "#EBEBEB"};color:${isOpen ? "#fff" : "#666"}">${si + 1}</div>
            <div class="sess-info">
              <div class="sess-title">${s.title}</div>
              <div class="pips">${pips(s.intensity)}</div>
            </div>
            <div class="sess-right">
              <div class="sess-dur" style="color:${z.pill}">${s.duration}</div>
              <div class="sess-chev">${isOpen ? "▲" : "▼"}</div>
            </div>
          </div>
          ${isOpen ? `
          <div class="sess-detail" style="border-top:1px solid ${z.border}30">
            <div>
              <div class="detail-label" style="color:${z.pill}">Plan</div>
              <div class="detail-text">${s.plan}</div>
            </div>
            <div class="focus-box">🎯 ${s.focus}</div>
            <div class="pills-row">
              <span class="pill" style="background:${z.bg};color:${z.pill}">${s.zone}</span>
              <span class="pill" style="background:#F0F0F0;color:#666">${indoor ? "🏠 KICKR" : "🌳 Buiten"}</span>
            </div>
          </div>` : ""}
        </div>`;
    }).join("");

    return `
      <div class="week-card ${isWeekOpen ? "open" : "closed"}" style="border-color:${c};box-shadow:${shadow}">
        <div class="week-header ${isWeekOpen ? "open" : "closed"}" onclick="toggleWeek(${wi})">
          <div class="week-badge ${isWeekOpen ? "open" : "closed"}">
            <div class="week-badge-label">wk</div>
            <div class="week-badge-num">${wi + 1}</div>
          </div>
          <div class="week-info">
            <div class="week-title-row">
              <span class="week-title">${week.label}</span>
              ${week.current ? '<span class="week-badge-current">DEZE WEEK</span>' : ""}
              ${week.note ? `<span class="week-badge-note">· ${week.note}</span>` : ""}
            </div>
            <div class="week-dates">${week.dates}</div>
          </div>
          <div class="week-meta">
            <span class="week-chevron">${isWeekOpen ? "▲" : "▼"}</span>
            <span class="week-mins">${totalMins(sessions)} min</span>
          </div>
        </div>
        ${isWeekOpen ? `<div class="sessions-wrap">${sessionsHtml}</div>` : ""}
      </div>`;
  }).join("");

  document.getElementById("root").innerHTML = `
    <div class="header">
      <div class="header-eyebrow">Fietsschema</div>
      <div class="header-title">Sept – Dec 2026</div>
      <div class="header-sub">3 sessies per week · jij kiest de dagen</div>
      <div class="toggle-wrap">
        <button class="toggle-btn ${!indoor ? "active" : "inactive"}" onclick="setIndoor(false)">🌳 Buiten</button>
        <button class="toggle-btn ${indoor ? "active" : "inactive"}" onclick="setIndoor(true)">⚙️ Binnen (KICKR)</button>
      </div>
      ${indoor ? '<div class="indoor-notice">⚡ Binnen = korter &amp; scherper — 100% trapefficiëntie</div>' : ""}
    </div>

    <div class="month-tabs">
      ${MONTHS.map(m => `
        <button class="tab-btn ${month === m ? "active" : "inactive"}" onclick="setMonth('${m}')">${m.slice(0,3)}</button>
      `).join("")}
    </div>

    <div class="phase-wrap">
      <div class="phase-title">${md.subtitle}</div>
      <div class="phase-tip">💡 ${md.tip}</div>
    </div>

    <div class="weeks-list">${weeksHtml}</div>

    <div class="footer">
      Tik op een week om te openen · Tik op een sessie voor details<br>
      Weken lopen ma–zo, gecategoriseerd op de maandag
    </div>
  `;
}

// ── Actions ────────────────────────────────────────────────────
function setIndoor(v)      { setState({ indoor: v, openSess: null }); }
function setMonth(m)       { setState({ month: m, openWeek: 0, openSess: null }); }
function toggleWeek(i)     { setState({ openWeek: state.openWeek === i ? null : i, openSess: null }); }
function toggleSess(key)   { setState({ openSess: state.openSess === key ? null : key }); }

// ── Boot ───────────────────────────────────────────────────────
render();
</script>
</body>
